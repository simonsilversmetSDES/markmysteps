# MarkMySteps — production deployment (Ubuntu + Cloudflare Tunnel)
#
# Security posture:
# - `db` has NO ports mapping: reachable only on the internal network.
# - Only `web` is exposed, and only on localhost — the Cloudflare Tunnel
#   (cloudflared) running on the host connects to 127.0.0.1:${WEB_PORT}.
# - Every service has CPU/memory limits so a leak can't take down the host.

name: markmysteps

services:
  db:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - internal
    ports:
      # Bind address + port are configurable via .env:
      # - WEB_BIND=127.0.0.1 (default) → only reachable on the server itself
      #   (fine when cloudflared runs directly on the host)
      # - WEB_BIND=0.0.0.0 → also reachable via LAN/Tailscale and from other
      #   containers (needed when cloudflared runs in Docker)
      # Port default 18790 — deliberately uncommon to avoid clashes.
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-18790}:80'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # WhatsApp Web bridge (WAHA). Sends the "new photos" updates and comment
  # notifications from a number linked by QR code in the app's settings.
  # Internal network only: the API is the one thing that talks to it, and it
  # posts incoming messages (STOP) back to the API's webhook.
  #
  # Note: this drives a normal WhatsApp account the way WhatsApp Web does,
  # which WhatsApp's terms do not allow. Use a spare number, not your own.
  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_HOOK_URL: http://api:3000/api/whatsapp/webhook?secret=${WHATSAPP_WEBHOOK_SECRET:-}
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_RESTART_ALL_SESSIONS: 'True'
      WAHA_DASHBOARD_ENABLED: 'false'
      WHATSAPP_SWAGGER_ENABLED: 'false'
    volumes:
      - waha-sessions:/app/.sessions
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # The page people see while `web` and `api` are being replaced.
  #
  # Bound to the very same host port, which is exactly why it can only run
  # while `web` is stopped — install.sh swaps one for the other. Behind a
  # profile so a plain `docker compose up -d` never starts it.
  maintenance:
    profiles: ['maintenance']
    build:
      context: .
      dockerfile: docker/maintenance.Dockerfile
    restart: 'no'
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-18790}:80'
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

networks:
  internal:
    driver: bridge

volumes:
  db-data:
  waha-sessions:
